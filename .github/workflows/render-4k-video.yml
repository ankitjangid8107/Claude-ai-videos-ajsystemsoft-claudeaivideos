name: Render AJ Christmas Reel (4K + 1080p)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "remotion.config.ts"
      - ".github/workflows/render-4k-video.yml"

permissions:
  contents: write   # needed to publish the Release assets

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System deps (ffmpeg + Chromium libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libcups2 libatk-bridge2.0-0
          ffmpeg -version | head -1

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx remotion browser ensure

      - name: Render 4K 2160x3840 + 1080p (chunked, retrying)
        run: |
          mkdir -p output
          node scripts/render-chunks.mjs 2 output/AJ_Christmas_Offer_4K_Reels.mp4 80 4
          node scripts/render-chunks.mjs 1 output/AJ_Christmas_Offer_1080p_Reels.mp4 150 4

      - name: Verify outputs
        run: |
          for f in output/*.mp4; do
            echo "== $f"; ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt,sample_rate,r_frame_rate -show_entries format=duration -of default=nw=1 "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: AJ_Christmas_Offer_Reels
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release assets (1-tap iPhone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reel-${{ github.run_number }}"
          gh release create "$TAG" output/AJ_Christmas_Offer_4K_Reels.mp4 output/AJ_Christmas_Offer_1080p_Reels.mp4 \
            --title "AJ Christmas Offer Reel #${{ github.run_number }}" \
            --notes "4K (2160x3840) and 1080p (1080x1920) renders. Open this page on iPhone Safari -> tap the .mp4 -> Share -> Save Video." \
            --target "${{ github.sha }}"
